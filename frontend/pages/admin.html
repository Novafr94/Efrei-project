<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Timeless Radio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .skip-link {
      position: absolute;
      top: -100px;
      left: var(--sp-4);
      background-color: var(--clr-text);
      color: #fff;
      padding: var(--sp-3) var(--sp-5);
      border-radius: var(--radius-md);
      font-weight: var(--fw-semibold);
      z-index: 200;
      transition: top var(--transition);
    }
    .skip-link:focus { top: var(--sp-3); color: #fff; outline: 3px solid var(--clr-focus); outline-offset: 2px; }

    .admin-layout {
      max-width: 860px;
      margin-inline: auto;
      padding: var(--sp-10) var(--sp-6);
    }

    /* Auth gate */
    .auth-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-height));
      gap: var(--sp-4);
    }

    .auth-gate h1 { font-size: var(--fs-xl); }

    .auth-form {
      display: flex;
      gap: var(--sp-2);
      width: 100%;
      max-width: 340px;
    }

    /* Sections */
    .admin-section {
      margin-bottom: var(--sp-12);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
      padding-bottom: var(--sp-4);
      border-bottom: 1px solid var(--clr-border);
    }

    .section-title {
      font-family: var(--ff-heading);
      font-size: var(--fs-xl);
      color: var(--clr-text);
    }

    /* Add form */
    .add-form {
      display: grid;
      gap: var(--sp-3);
      margin-bottom: var(--sp-6);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--sp-3);
    }

    .field label {
      display: block;
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      color: var(--clr-text-muted);
      margin-bottom: var(--sp-1);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    select.input {
      cursor: pointer;
    }

    /* Items list */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-3) var(--sp-4);
      background-color: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
    }

    .item-info { flex: 1; min-width: 0; }

    .item-title {
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      color: var(--clr-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: var(--fs-xs);
      color: var(--clr-text-muted);
    }

    .btn-delete {
      flex-shrink: 0;
      min-height: 44px;
      min-width: 44px;
      padding: var(--sp-1) var(--sp-3);
      font-size: var(--fs-xs);
      background: transparent;
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm);
      color: var(--clr-text-muted);
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }

    .btn-delete:hover { border-color: #c0392b; color: #c0392b; }
    .btn-delete:focus-visible { outline: 2px solid var(--clr-focus); outline-offset: 2px; }

    .empty-state {
      text-align: center;
      color: var(--clr-text-muted);
      font-size: var(--fs-xs);
      padding: var(--sp-6);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: var(--sp-6);
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--clr-text);
      color: #fff;
      padding: var(--sp-3) var(--sp-6);
      border-radius: var(--radius-md);
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      z-index: 200;
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <a href="#auth-form" class="skip-link" id="skip-link">Skip to content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a href="/" class="nav-logo" aria-label="Timeless Radio — Home">Timeless Radio</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/radio">Listen</a></li>
          <li><a href="/admin" aria-current="page">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Auth gate (shown until password entered) -->
  <div id="auth-gate" class="auth-gate">
    <h1>Admin access</h1>
    <form class="auth-form" id="auth-form" aria-label="Enter admin password">
      <input class="input" id="password-input" type="password"
             placeholder="Password" aria-label="Admin password" autocomplete="current-password">
      <button class="btn btn-primary" type="submit">Enter</button>
    </form>
    <p class="text-muted text-sm" id="auth-error" aria-live="polite"></p>
  </div>

  <!-- Admin panel (shown after auth) -->
  <main id="admin-panel" style="display:none" aria-label="Admin panel" tabindex="-1">
    <div class="admin-layout">

      <!-- ── Now Playing & Queue ──────────────────────────────── -->
      <section class="admin-section" aria-labelledby="queue-title">
        <div class="section-header">
          <h2 id="queue-title" class="section-title">Now Playing & Queue</h2>
        </div>

        <div id="now-playing-box" style="padding:var(--sp-4);background:var(--clr-surface);border:1px solid var(--clr-border);border-radius:var(--radius-md);margin-bottom:var(--sp-4)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)">
            <div id="np-info">
              <div class="item-title" id="np-title">—</div>
              <div class="item-meta" id="np-meta">—</div>
            </div>
            <button class="btn btn-outline" id="btn-skip" type="button" aria-label="Skip to next track" style="min-height:44px;min-width:44px">Skip</button>
          </div>
          <div style="margin-top:var(--sp-2);height:3px;background:var(--clr-border);border-radius:2px;overflow:hidden">
            <div id="np-progress" style="height:100%;width:0%;background:var(--clr-copper);transition:width 1s linear"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:var(--sp-1)">
            <span class="text-muted text-sm" id="np-time">0:00</span>
            <span class="text-muted text-sm" id="np-duration">0:00</span>
          </div>
        </div>

        <form id="queue-add-form" style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4)" aria-label="Add to queue">
          <select class="input" id="queue-track-select" style="flex:1" aria-label="Select a track">
            <option value="">— Select a track —</option>
          </select>
          <button class="btn btn-primary" type="submit" style="min-height:48px">Add</button>
        </form>

        <div id="queue-list" class="item-list"></div>
      </section>

      <!-- ── Tracks ──────────────────────────────────────────── -->
      <section class="admin-section" aria-labelledby="tracks-title">
        <div class="section-header">
          <h2 id="tracks-title" class="section-title">Tracks</h2>
          <span class="text-muted text-sm" id="tracks-count"></span>
        </div>

        <!-- Upload zone -->
        <div id="upload-zone" style="border:2px dashed var(--clr-border);border-radius:var(--radius-md);padding:var(--sp-8);text-align:center;margin-bottom:var(--sp-6);cursor:pointer;transition:border-color var(--transition)" aria-label="Zone d'upload MP3" role="button" tabindex="0">
          <p style="font-size:var(--fs-sm);color:var(--clr-text-muted);margin-bottom:var(--sp-2)">Drop MP3 files here or click to select</p>
          <input type="file" id="upload-input" multiple accept=".mp3" style="display:none">
          <div id="upload-file-list" style="margin-top:var(--sp-3);text-align:left"></div>
          <button class="btn btn-primary" id="btn-upload" type="button" style="display:none;margin-top:var(--sp-3);min-height:48px">Upload</button>
          <div id="upload-progress" style="margin-top:var(--sp-3)"></div>
          <div id="upload-results" style="margin-top:var(--sp-3)"></div>
        </div>

        <details style="margin-bottom:var(--sp-6)">
          <summary style="cursor:pointer;font-size:var(--fs-sm);color:var(--clr-text-muted);font-weight:var(--fw-semibold)">Manual entry</summary>
        <form class="add-form" id="track-form" aria-label="Add a track" style="margin-top:var(--sp-3)">
          <div class="form-row">
            <div class="field">
              <label for="track-title">Title *</label>
              <input class="input" id="track-title" type="text" placeholder="Summertime" required>
            </div>
            <div class="field">
              <label for="track-artist">Artist *</label>
              <input class="input" id="track-artist" type="text" placeholder="Billie Holiday" required>
            </div>
          </div>
          <div class="form-row-3">
            <div class="field">
              <label for="track-year">Year</label>
              <input class="input" id="track-year" type="number" placeholder="1935" min="1900" max="1980">
            </div>
            <div class="field">
              <label for="track-duration">Duration (sec) *</label>
              <input class="input" id="track-duration" type="number" placeholder="180" min="1" required>
            </div>
            <div class="field">
              <label for="track-slot">Mood</label>
              <select class="input" id="track-slot">
                <option value="all">All moods</option>
                <option value="energetic">Energetic (morning)</option>
                <option value="calm">Calm (evening)</option>
                <option value="jazz">Jazz (evening)</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="track-filename">Filename * <span class="text-muted">(e.g. summertime.mp3)</span></label>
            <input class="input" id="track-filename" type="text" placeholder="summertime.mp3" required>
          </div>
          <div>
            <button class="btn btn-primary" type="submit">Add track</button>
          </div>
        </form>
        </details>

        <div class="item-list" id="tracks-list"></div>
      </section>

      <!-- ── Anecdotes ───────────────────────────────────────── -->
      <section class="admin-section" aria-labelledby="anecdotes-title">
        <div class="section-header">
          <h2 id="anecdotes-title" class="section-title">Anecdotes</h2>
          <span class="text-muted text-sm" id="anecdotes-count"></span>
        </div>

        <form class="add-form" id="anecdote-form" aria-label="Add an anecdote">
          <div class="field">
            <label for="anecdote-title-input">Title *</label>
            <input class="input" id="anecdote-title-input" type="text"
                   placeholder="The birth of Jazz" required>
          </div>
          <div class="field">
            <label for="anecdote-content">Content *</label>
            <textarea class="input" id="anecdote-content" rows="3"
                      placeholder="In the early 20th century…" required
                      style="resize:vertical; height:auto"></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="anecdote-artist">Artist <span class="text-muted">(optional)</span></label>
              <input class="input" id="anecdote-artist" type="text" placeholder="Billie Holiday">
            </div>
            <div class="field">
              <label for="anecdote-year">Year <span class="text-muted">(optional)</span></label>
              <input class="input" id="anecdote-year" type="number" placeholder="1939" min="1900" max="1980">
            </div>
          </div>
          <div>
            <button class="btn btn-primary" type="submit">Add anecdote</button>
          </div>
        </form>

        <div class="item-list" id="anecdotes-list"></div>
      </section>

      <!-- ── Censor words ────────────────────────────────────── -->
      <section class="admin-section" aria-labelledby="censor-title">
        <div class="section-header">
          <h2 id="censor-title" class="section-title">Censor words</h2>
          <span class="text-muted text-sm" id="censor-count"></span>
        </div>

        <form class="add-form" id="censor-form" aria-label="Add a banned word" style="max-width:400px">
          <div class="form-row">
            <div class="field">
              <label for="censor-word">Word *</label>
              <input class="input" id="censor-word" type="text" placeholder="badword" required>
            </div>
            <div class="field" style="display:flex;align-items:flex-end">
              <button class="btn btn-primary" type="submit" style="width:100%">Add word</button>
            </div>
          </div>
        </form>

        <div class="item-list" id="censor-list"></div>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Auth ────────────────────────────────────────────────
    let AUTH_TOKEN = sessionStorage.getItem('admin_token') || '';

    async function checkAuth(token) {
      const res = await fetch('/api/admin/tracks', {
        headers: { Authorization: `Bearer ${token}` }
      });
      return res.ok;
    }

    async function init() {
      if (AUTH_TOKEN && await checkAuth(AUTH_TOKEN)) {
        showPanel();
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password-input').value;
      if (await checkAuth(pwd)) {
        AUTH_TOKEN = pwd;
        sessionStorage.setItem('admin_token', pwd);
        showPanel();
      } else {
        document.getElementById('auth-error').textContent = 'Incorrect password.';
      }
    });

    function showPanel() {
      document.getElementById('auth-gate').style.display  = 'none';
      document.getElementById('admin-panel').style.display = '';
      document.getElementById('skip-link').setAttribute('href', '#admin-panel');
      loadAll();
    }

    // ── Toast ───────────────────────────────────────────────
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ── API helpers ─────────────────────────────────────────
    function authHeaders() {
      return { 'Content-Type': 'application/json', Authorization: `Bearer ${AUTH_TOKEN}` };
    }

    async function apiFetch(url, opts = {}) {
      const res = await fetch(url, { ...opts, headers: authHeaders() });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Error ${res.status}`);
      }
      return res.json();
    }

    // ── Tracks ──────────────────────────────────────────────
    async function loadTracks() {
      const tracks = await apiFetch('/api/admin/tracks');
      document.getElementById('tracks-count').textContent = `${tracks.length} track${tracks.length !== 1 ? 's' : ''}`;
      const list = document.getElementById('tracks-list');
      if (!tracks.length) {
        list.innerHTML = '<p class="empty-state">No tracks yet.</p>';
        return;
      }
      list.innerHTML = tracks.map(t => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(t.title)}</div>
            <div class="item-meta">${esc(t.artist)} · ${t.year || '—'} · ${t.duration}s · ${t.time_slot} · ${esc(t.filename)}</div>
          </div>
          <button class="btn-delete" data-id="${t.id}" data-type="track" aria-label="Delete ${esc(t.title)}">Delete</button>
        </div>`).join('');
    }

    document.getElementById('track-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiFetch('/api/admin/tracks', {
          method: 'POST',
          body: JSON.stringify({
            title:     document.getElementById('track-title').value.trim(),
            artist:    document.getElementById('track-artist').value.trim(),
            year:      document.getElementById('track-year').value || null,
            duration:  document.getElementById('track-duration').value,
            filename:  document.getElementById('track-filename').value.trim(),
            time_slot: document.getElementById('track-slot').value,
          })
        });
        e.target.reset();
        showToast('Track added.');
        loadTracks();
      } catch (err) { showToast(err.message); }
    });

    // ── Anecdotes ───────────────────────────────────────────
    async function loadAnecdotes() {
      const items = await apiFetch('/api/admin/anecdotes');
      document.getElementById('anecdotes-count').textContent = `${items.length} anecdote${items.length !== 1 ? 's' : ''}`;
      const list = document.getElementById('anecdotes-list');
      if (!items.length) {
        list.innerHTML = '<p class="empty-state">No anecdotes yet.</p>';
        return;
      }
      list.innerHTML = items.map(a => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(a.title)}</div>
            <div class="item-meta">${esc(a.content.slice(0, 80))}${a.content.length > 80 ? '…' : ''}</div>
          </div>
          <button class="btn-delete" data-id="${a.id}" data-type="anecdote" aria-label="Delete ${esc(a.title)}">Delete</button>
        </div>`).join('');
    }

    document.getElementById('anecdote-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiFetch('/api/admin/anecdotes', {
          method: 'POST',
          body: JSON.stringify({
            title:   document.getElementById('anecdote-title-input').value.trim(),
            content: document.getElementById('anecdote-content').value.trim(),
            artist:  document.getElementById('anecdote-artist').value.trim() || null,
            year:    document.getElementById('anecdote-year').value || null,
          })
        });
        e.target.reset();
        showToast('Anecdote added.');
        loadAnecdotes();
      } catch (err) { showToast(err.message); }
    });

    // ── Censor words ────────────────────────────────────────
    async function loadCensor() {
      const items = await apiFetch('/api/admin/censor');
      document.getElementById('censor-count').textContent = `${items.length} word${items.length !== 1 ? 's' : ''}`;
      const list = document.getElementById('censor-list');
      if (!items.length) {
        list.innerHTML = '<p class="empty-state">No banned words.</p>';
        return;
      }
      list.innerHTML = items.map(w => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(w.word)}</div>
          </div>
          <button class="btn-delete" data-id="${w.id}" data-type="censor" aria-label="Remove ${esc(w.word)}">Remove</button>
        </div>`).join('');
    }

    document.getElementById('censor-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiFetch('/api/admin/censor', {
          method: 'POST',
          body: JSON.stringify({ word: document.getElementById('censor-word').value.trim() })
        });
        e.target.reset();
        showToast('Word added.');
        loadCensor();
      } catch (err) { showToast(err.message); }
    });

    // ── Delete (event delegation) ───────────────────────────
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.btn-delete');
      if (!btn) return;
      const { id, type } = btn.dataset;
      const urlMap = { track: 'tracks', anecdote: 'anecdotes', censor: 'censor' };
      const reloadMap = { track: loadTracks, anecdote: loadAnecdotes, censor: loadCensor };
      try {
        await apiFetch(`/api/admin/${urlMap[type]}/${id}`, { method: 'DELETE' });
        showToast('Deleted.');
        reloadMap[type]();
      } catch (err) { showToast(err.message); }
    });

    // ── Upload ──────────────────────────────────────────────
    const uploadZone    = document.getElementById('upload-zone');
    const uploadInput   = document.getElementById('upload-input');
    const btnUpload     = document.getElementById('btn-upload');
    const uploadFileList = document.getElementById('upload-file-list');
    const uploadProgress = document.getElementById('upload-progress');
    const uploadResults  = document.getElementById('upload-results');

    let selectedFiles = [];

    uploadZone.addEventListener('click', () => uploadInput.click());
    uploadZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') uploadInput.click(); });

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--clr-copper)';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.borderColor = 'var(--clr-border)';
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--clr-border)';
      const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.mp3'));
      if (files.length) setUploadFiles(files);
    });

    uploadInput.addEventListener('change', () => {
      if (uploadInput.files.length) setUploadFiles(Array.from(uploadInput.files));
    });

    function setUploadFiles(files) {
      selectedFiles = files;
      uploadFileList.innerHTML = files.map(f =>
        `<div class="text-sm" style="color:var(--clr-text)">${esc(f.name)} <span class="text-muted">(${(f.size / 1024 / 1024).toFixed(1)} MB)</span></div>`
      ).join('');
      btnUpload.style.display = '';
      uploadResults.innerHTML = '';
    }

    btnUpload.addEventListener('click', () => {
      if (!selectedFiles.length) return;
      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('files', f));

      btnUpload.disabled = true;
      btnUpload.textContent = 'Upload en cours...';
      uploadProgress.innerHTML = '<div style="height:4px;background:var(--clr-border);border-radius:2px;overflow:hidden"><div id="upload-bar" style="height:100%;width:0%;background:var(--clr-copper);transition:width 0.3s"></div></div>';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/admin/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${AUTH_TOKEN}`);

      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const bar = document.getElementById('upload-bar');
          if (bar) bar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
        }
      });

      xhr.addEventListener('load', () => {
        btnUpload.disabled = false;
        btnUpload.textContent = 'Upload';
        btnUpload.style.display = 'none';
        uploadFileList.innerHTML = '';
        uploadProgress.innerHTML = '';
        selectedFiles = [];
        uploadInput.value = '';

        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          uploadResults.innerHTML = data.results.map(r =>
            r.success
              ? `<div class="text-sm" style="color:#27ae60">${esc(r.title)} — ${esc(r.artist)} (${r.duration}s)</div>`
              : `<div class="text-sm" style="color:#c0392b">${esc(r.originalName)}: ${esc(r.error)}</div>`
          ).join('');
          const ok = data.results.filter(r => r.success).length;
          showToast(`${ok} file(s) uploaded.`);
          loadTracks();
          loadAll();
        } else {
          const err = JSON.parse(xhr.responseText || '{}');
          showToast(err.error || 'Upload failed.');
        }
      });

      xhr.addEventListener('error', () => {
        btnUpload.disabled = false;
        btnUpload.textContent = 'Upload';
        uploadProgress.innerHTML = '';
        showToast('Network error.');
      });

      xhr.send(formData);
    });

    // ── Now Playing & Queue ────────────────────────────────
    const socket = io();
    let npInterval = null;
    let npStartedAt = 0;
    let npDuration  = 0;

    function fmtTime(s) {
      const m = Math.floor(s / 60);
      return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    }

    function renderNowPlaying(track, position) {
      const titleEl    = document.getElementById('np-title');
      const metaEl     = document.getElementById('np-meta');
      const timeEl     = document.getElementById('np-time');
      const durEl      = document.getElementById('np-duration');
      const progressEl = document.getElementById('np-progress');

      if (!track) {
        titleEl.textContent    = 'No track';
        metaEl.textContent     = 'The library is empty';
        timeEl.textContent     = '0:00';
        durEl.textContent      = '0:00';
        progressEl.style.width = '0%';
        npDuration = 0;
        if (npInterval) { clearInterval(npInterval); npInterval = null; }
        return;
      }

      titleEl.textContent = track.title;
      metaEl.textContent  = `${track.artist} · ${track.year || '—'} · ${track.duration}s · ${track.filename}`;
      npDuration  = track.duration;
      npStartedAt = Date.now() - (position * 1000);

      if (npInterval) clearInterval(npInterval);
      npInterval = setInterval(() => {
        const pos = Math.min(Math.floor((Date.now() - npStartedAt) / 1000), npDuration);
        timeEl.textContent     = fmtTime(pos);
        durEl.textContent      = fmtTime(npDuration);
        progressEl.style.width = npDuration > 0 ? ((pos / npDuration) * 100) + '%' : '0%';
      }, 1000);
    }

    function renderQueue(queue) {
      const list = document.getElementById('queue-list');
      if (!queue || !queue.length) {
        list.innerHTML = '<p class="empty-state">Queue is empty — the auto-DJ picks tracks automatically.</p>';
        return;
      }
      list.innerHTML = queue.map((t, i) => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(t.title)}</div>
            <div class="item-meta">${esc(t.artist)} · ${t.duration}s</div>
          </div>
          <button class="btn-delete" data-queue-index="${i}" aria-label="Remove ${esc(t.title)}">Remove</button>
        </div>`).join('');
    }

    function populateQueueSelect(tracks) {
      const sel = document.getElementById('queue-track-select');
      const current = sel.value;
      sel.innerHTML = '<option value="">— Select a track —</option>' +
        tracks.map(t => `<option value="${t.id}">${esc(t.title)} — ${esc(t.artist)}</option>`).join('');
      sel.value = current;
    }

    async function loadQueue() {
      try {
        const data = await apiFetch('/api/admin/queue');
        renderNowPlaying(data.currentTrack, 0);
        renderQueue(data.queue);
      } catch { /* ignore on first load if server not ready */ }
    }

    async function loadNowPlaying() {
      try {
        const res = await fetch('/api/radio/now-playing');
        if (res.ok) {
          const data = await res.json();
          renderNowPlaying(data.track, data.position);
        }
      } catch { /* ignore */ }
    }

    socket.on('track_change', (data) => {
      renderNowPlaying(data.track, data.position);
    });

    socket.on('queue_update', (data) => {
      renderNowPlaying(data.currentTrack, 0);
      renderQueue(data.queue);
    });

    document.getElementById('btn-skip').addEventListener('click', async () => {
      try {
        await apiFetch('/api/admin/queue/skip', { method: 'POST', body: '{}' });
        showToast('Skipped to next track.');
      } catch (err) { showToast(err.message); }
    });

    document.getElementById('queue-add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const trackId = Number(document.getElementById('queue-track-select').value);
      if (!trackId) return showToast('Please select a track.');
      try {
        await apiFetch('/api/admin/queue', {
          method: 'POST',
          body: JSON.stringify({ trackId })
        });
        showToast('Added to queue.');
      } catch (err) { showToast(err.message); }
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-queue-index]');
      if (!btn) return;
      const index = Number(btn.dataset.queueIndex);
      try {
        await apiFetch(`/api/admin/queue/${index}`, { method: 'DELETE' });
        showToast('Removed from queue.');
      } catch (err) { showToast(err.message); }
    });

    // ── Load all ────────────────────────────────────────────
    async function loadAll() {
      const tracks = await apiFetch('/api/admin/tracks').catch(() => []);
      populateQueueSelect(Array.isArray(tracks) ? tracks : []);
      loadTracks();
      loadAnecdotes();
      loadCensor();
      loadNowPlaying();
      loadQueue();
    }

    // XSS-safe escaping for innerHTML
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
