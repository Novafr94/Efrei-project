<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Timeless Radio — Login">
  <meta name="theme-color" content="#f5f5f7">
  <title>Login — Timeless Radio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .skip-link {
      position: absolute;
      top: -100px;
      left: var(--sp-4);
      background-color: var(--clr-text);
      color: #fff;
      padding: var(--sp-3) var(--sp-5);
      border-radius: var(--radius-md);
      font-weight: var(--fw-semibold);
      z-index: 200;
      transition: top var(--transition);
    }
    .skip-link:focus { top: var(--sp-3); color: #fff; outline: 3px solid var(--clr-focus); outline-offset: 2px; }
  </style>
</head>

<body>
  <a href="#content" class="skip-link">Skip to content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a href="/" class="nav-logo" aria-label="Timeless Radio — Home">Timeless Radio</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/radio">Listen</a></li>
          <li><a href="/admin">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content">
    <div class="flex-center" style="min-height: calc(100vh - var(--nav-height)); flex-direction: column; gap: var(--sp-4); padding: var(--sp-10) var(--sp-6);">
      <h1 style="font-size: var(--fs-xl);">Login</h1>
      <p class="text-muted text-sm">User accounts are coming in Phase 2. Stay tuned!</p>
      <a href="/" class="btn btn-primary">Back to home</a>
    </div>
  </main>

</body>
</html>
